<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — Datafin Beta</title>
  <meta name="theme-color" content="#0B0824">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0B0824;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center}
    main{max-width:480px}
    img{width:150px;height:auto;margin-bottom:28px}
    .code{margin:0;font-size:clamp(72px,18vw,120px);font-weight:800;line-height:1;background:linear-gradient(90deg,#6D28FF,#D946EF,#FF7A21);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{margin:12px 0 8px;font-size:clamp(22px,5vw,28px)}
    p{margin:0 0 28px;color:#C9C5E0;line-height:1.6}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a.b{display:inline-block;padding:14px 24px;border-radius:999px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(90deg,#6D28FF,#D946EF)}
    a.b.line{background:none;border:1.5px solid rgba(255,255,255,.35)}
    a.b:focus-visible{outline:3px solid #FF9A3D;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo/logo-oficial-blanco.png" alt="datafin" width="720" height="183">
    <p class="code" aria-hidden="true">404</p>
    <h1>No encontramos esta página</h1>
    <p>Es posible que el enlace haya cambiado o que la dirección esté mal escrita.</p>
    <div class="btns">
      <a class="b" href="/">Ir al inicio</a>
      <a class="b line" href="https://wa.me/573127045885?text=Hola%2C%20necesito%20ayuda%20con%20Datafin">Escribirnos por WhatsApp</a>
    </div>
  </main>
</body>
</html>
