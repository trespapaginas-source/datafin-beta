# Panel de contenido de Datafin Beta (Pages CMS).
# Las personas invitadas solo ven lo que está aquí: no pueden tocar el diseño ni el código.
# Cada texto tiene límite de largo. Si alguien escribe algo que Meta puede leer como promesa
# (p. ej. «eliminamos», «garantizado», «100 %»), la web NO se actualiza y la versión anterior sigue en línea.

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "Contenido: crea {filename} (panel)"
      update: "Contenido: actualiza {filename} (panel)"
      delete: "Contenido: borra {filename} (panel)"

content:
  - name: datos
    label: "Precios y contacto"
    type: group
    items:
      - name: ajustes
        label: "Precios, WhatsApp, correo y redes"
        type: file
        path: contenido/ajustes.json
        format: json
        fields:
          - name: whatsapp
            label: "WhatsApp (solo números, con indicativo)"
            type: string
            required: true
            description: "Ej.: 573127045885. Se usa en todos los botones de WhatsApp y en las páginas legales."
            options:
              maxlength: 15
          - name: whatsapp_visible
            label: "WhatsApp (como se ve escrito)"
            type: string
            required: true
            description: "Ej.: +57 312 704 5885"
            options:
              maxlength: 25
          - name: correo
            label: "Correo"
            type: string
            required: true
            options:
              maxlength: 60
          - name: direccion
            label: "Dirección"
            type: string
            required: true
            description: "Ej.: Carrera 65 # 76-57"
            options:
              maxlength: 50
          - name: ciudad
            label: "Ciudad y departamento"
            type: string
            required: true
            options:
              maxlength: 50
          - name: horario_quienes_somos
            label: "Horario (sección Quiénes somos)"
            type: string
            required: true
            options:
              maxlength: 70
          - name: horario_pie
            label: "Horario (pie de página)"
            type: string
            required: true
            options:
              maxlength: 70
          - name: precio_consulta_general
            label: "Precio de la Consulta General (COP)"
            type: number
            required: true
            description: "Solo el número, sin puntos ni signos. Ej.: 69900. Se actualiza en la portada, las preguntas frecuentes y los términos."
            options:
              min: 1000
              max: 5000000
          - name: precio_historial
            label: "Precio de un solo historial (COP)"
            type: number
            required: true
            description: "Solo el número. Ej.: 49900."
            options:
              min: 1000
              max: 5000000
          - name: instagram
            label: "Instagram (enlace)"
            type: string
            required: true
            pattern:
              regex: "^https://[^\\s]+$"
              message: "Debe ser un enlace que empiece con https://"
            description: "Debe empezar con https://"
            options:
              maxlength: 150
          - name: tiktok
            label: "TikTok (enlace)"
            type: string
            required: true
            pattern:
              regex: "^https://[^\\s]+$"
              message: "Debe ser un enlace que empiece con https://"
            description: "Debe empezar con https://"
            options:
              maxlength: 150
          - name: facebook
            label: "Facebook (enlace)"
            type: string
            required: true
            pattern:
              regex: "^https://[^\\s]+$"
              message: "Debe ser un enlace que empiece con https://"
            description: "Debe empezar con https://"
            options:
              maxlength: 150

